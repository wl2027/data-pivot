name: Run UI component tests

on:
  workflow_dispatch:

concurrency:
  group: ui-component-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui_component_test:
    name: UI component tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    permissions:
      contents: read
    steps:
      - name: Fetch sources
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run IntelliJ UI component tests
        run: ./gradlew ideaUiTest --no-configuration-cache --console=plain

      - name: Upload UI test reports on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-reports-${{ matrix.os }}-${{ github.run_id }}
          path: build/reports/tests/ideaUiTest
          if-no-files-found: ignore
          retention-days: 7
